<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">

  <title>Cocos Creator | playtest-demo</title>

  <!--http://www.html5rocks.com/en/mobile/mobifying/-->
  <meta name="viewport"
        content="width=device-width,user-scalable=no,initial-scale=1,minimum-scale=1,maximum-scale=1,minimal-ui=true"/>

  <!--https://developer.apple.com/library/safari/documentation/AppleApplications/Reference/SafariHTMLRef/Articles/MetaTags.html-->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">

  <!-- force webkit on 360 -->
  <meta name="renderer" content="webkit"/>
  <meta name="force-rendering" content="webkit"/>
  <!-- force edge on IE -->
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
  <meta name="msapplication-tap-highlight" content="no">

  <!-- force full screen on some browser -->
  <meta name="full-screen" content="yes"/>
  <meta name="x5-fullscreen" content="true"/>
  <meta name="360-fullscreen" content="true"/>

  <!--fix fireball/issues/3568 -->
  <!--<meta name="browsermode" content="application">-->
  <meta name="x5-page-mode" content="app">

  <!--<link rel="apple-touch-icon" href=".png" />-->
  <!--<link rel="apple-touch-icon-precomposed" href=".png" />-->

  <link rel="stylesheet" type="text/css" href="style.css"/>

</head>
<body class="is-loading">
  <div id="LoadingView" aria-live="polite">
    <div class="loading-panel">
      <div class="loading-mark" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
      </div>
      <div class="loading-title">Wood Rush</div>
      <div id="LoadingText" class="loading-text">加载资源中...</div>
      <div class="loading-track" aria-hidden="true">
        <div class="loading-bar"></div>
      </div>
    </div>
  </div>

  <div id="GameDiv" cc_exact_fit_screen="true">
      <div id="Cocos3dGameContainer">
        <canvas id="GameCanvas" oncontextmenu="event.preventDefault()" tabindex="99"></canvas>
      </div>
    </div>
  

<!-- Polyfills bundle. -->

<script src="src/polyfills.bundle.js" charset="utf-8"> </script>


<!-- SystemJS support. -->
<script src="src/system.bundle.js" charset="utf-8"> </script>

<!-- Import map -->
<script src="src/import-map.json" type="systemjs-importmap" charset="utf-8"> </script>

<script>
    (function () {
      var loadingView = document.getElementById('LoadingView');
      var loadingText = document.getElementById('LoadingText');
      var hidden = false;
      var startedAt = Date.now();

      function hideLoadingView() {
        if (hidden || !loadingView) {
          return;
        }
        hidden = true;
        document.body.classList.remove('is-loading');
        loadingView.classList.add('is-hidden');
        setTimeout(function () {
          if (loadingView && loadingView.parentNode) {
            loadingView.parentNode.removeChild(loadingView);
          }
        }, 650);
      }

      function showLoadingError(err) {
        if (loadingText) {
          loadingText.textContent = '加载失败，请刷新重试';
        }
        if (loadingView) {
          loadingView.classList.add('has-error');
        }
        console.error(err);
      }

      window.__hideCocosLoadingView = hideLoadingView;
      window.__showCocosLoadingError = showLoadingError;

      function waitForFirstScene() {
        var timer = setInterval(function () {
          try {
            if (window.cc && cc.director && cc.director.getScene && cc.director.getScene()) {
              clearInterval(timer);
              setTimeout(hideLoadingView, 300);
              return;
            }
          } catch (err) {
          }

          if (Date.now() - startedAt > 30000 && window.cc && cc.game) {
            clearInterval(timer);
            hideLoadingView();
          }
        }, 120);
      }

      waitForFirstScene();

      System.import('./index.js').catch(showLoadingError);
    }());
</script>

</body>
</html>
